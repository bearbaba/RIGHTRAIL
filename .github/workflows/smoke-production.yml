name: RIGHTRAIL live Production API smoke
on:
  push:
    branches: [main]
    paths:
      - 'scripts/smoke-production.mjs'
      - '.github/workflows/smoke-production.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live HTTPS config, latest-final totals and ID boundaries
        run: node scripts/smoke-production.mjs
