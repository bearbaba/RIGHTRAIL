name: RIGHTRAIL unsigned publish fee preflight
on:
  push:
    branches: [main]
    paths:
      - 'scripts/quote-publish.mjs'
      - '.github/workflows/quote-publish.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Quote actual publish without wallet or signature
        run: node scripts/quote-publish.mjs
