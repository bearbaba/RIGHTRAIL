name: RIGHTRAIL signed Request 1 readback
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-request-1.mjs'
      - '.github/workflows/verify-request-1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Independently verify signed request persisted in latest-final RightsRail storage
        run: node scripts/verify-request-1.mjs
