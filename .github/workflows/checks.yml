name: RIGHTRAIL checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify signed proof boundaries
        run: npm test
      - name: Build UI and serverless dependencies
        run: npm run build
      - name: Check Python contract syntax
        run: python3 -m py_compile contracts/*.py
