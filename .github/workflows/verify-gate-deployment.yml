name: RIGHTRAIL Gate deployment readback
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_gate_deployment.mjs'
      - '.github/workflows/verify-gate-deployment.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Read transaction, verify RightsAccessGate source and linked RightsRail
        run: node scripts/verify_gate_deployment.mjs
