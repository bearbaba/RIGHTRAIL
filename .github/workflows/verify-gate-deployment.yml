name: RIGHTRAIL Gate deployment readback
on:
  workflow_dispatch:
    inputs:
      tx_hash:
        description: Exact RightsAccessGate deploy transaction hash (NOT RightsRail)
        type: string
        required: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Verify deployed Gate source, constructor and latest-final stats without signing
        env:
          RIGHTRAIL_GATE_TX_HASH: ${{ inputs.tx_hash }}
        run: node scripts/verify_gate_deployment.mjs
