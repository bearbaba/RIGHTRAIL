name: RIGHTRAIL negative signed wallet proof (Production)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/test-signed-denial.mjs'
      - '.github/workflows/test-signed-denial.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Valid signature from unrelated wallet must be denied
        run: node scripts/test-signed-denial.mjs
