name: RIGHTRAIL V2 candidate checks
on:
  push:
    branches: [milestone/v2-scoped-grants]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: python3 -m py_compile contracts/*.py
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
  unsigned-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/preflight_v2.mjs
  live-readback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node scripts/verify_v2_live.mjs

      - run: node scripts/probe-v2-request.mjs

      - run: node scripts/probe-fee-write.mjs
